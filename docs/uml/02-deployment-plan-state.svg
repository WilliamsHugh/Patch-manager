.5" ry="12.5"/><text x="243.81" y="538.32" fill="#000" font-size="14" textLength="78.246">DEPLOYING</text><rect x="7" y="643.448" width="91.858" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="12" y="668.88" fill="#000" font-size="14" textLength="81.858">COMPLETED</text><rect x="220.78" y="643.448" width="56.298" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="225.78" y="668.88" fill="#000" font-size="14" textLength="46.298">FAILED</text><rect x="196.88" y="774.008" width="104.094" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="201.88" y="799.44" fill="#000" font-size="14" textLength="94.094">ROLLED_BACK</text><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="24"><path d="M853.7,264.068 L853.7,282.768 L818.86,286.768 L853.7,290.768 L853.7,309.48 A0,0 0 0 0 853.7,309.48 L1156.163,309.48 A0,0 0 0 0 1156.163,309.48 L1156.163,274.068 L1146.163,264.068 L853.7,264.068 A0,0 0 0 0 853.7,264.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1146.163,264.068 L1146.163,274.068 L1156.163,274.068 L1146.163,264.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="859.7" y="282.965" fill="#000" font-size="13" textLength="281.463">The enum and seed use this state, but there is</text><text x="859.7" y="300.671" fill="#000" font-size="13" textLength="266.032">no submit endpoint to reach it from a draft.</text></g><g class="entity" data-qualified-name="GMN29" id="ent0030" data-source-line="28"><path d="M359.34,388.478 L359.34,407.188 L323.99,411.188 L359.34,415.188 L359.34,433.89 A0,0 0 0 0 359.34,433.89 L668.511,433.89 A0,0 0 0 0 668.511,433.89 L668.511,398.478 L658.511,388.478 L359.34,388.478 A0,0 0 0 0 359.34,388.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M658.511,388.478 L658.511,398.478 L668.511,398.478 L658.511,388.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="365.34" y="407.375" fill="#000" font-size="13" textLength="288.171">The current review API accepts review requests</text><text x="365.34" y="425.081" fill="#000" font-size="13" textLength="254.436">without validating the plan's source state.</text></g><g class="entity" data-qualified-name="GMN32" id="ent0033" data-source-line="32"><path d="M811.61,388.478 L811.61,407.188 L776.65,411.188 L811.61,415.188 L811.61,433.89 A0,0 0 0 0 811.61,433.89 L1138.253,433.89 A0,0 0 0 0 1138.253,433.89 L1138.253,398.478 L1128.253,388.478 L811.61,388.478 A0,0 0 0 0 811.61,388.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1128.253,388.478 L1128.253,398.478 L1138.253,398.478 L1128.253,388.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="817.61" y="407.375" fill="#000" font-size="13" textLength="296.231">A rejected plan remains recorded. A revised plan</text><text x="817.61" y="425.081" fill="#000" font-size="13" textLength="305.643">would be a new object, not a state transition here.</text></g><g class="entity" data-qualified-name="GMN35" id="ent0036" data-source-line="36"><path d="M311.61,631.888 L311.61,695.006 L652.241,695.006 L652.241,641.888 L642.241,631.888 L311.61,631.888" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M642.241,631.888 L642.241,641.888 L652.241,641.888 L642.241,631.888" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="317.61" y="650.785" fill="#000" font-size="13" textLength="312.884">The current deploy API sets the plan to DEPLOYING</text><text x="317.61" y="668.491" fill="#000" font-size="13" textLength="278.343">and its tasks to PENDING. An agent execution</text><text x="317.61" y="686.197" fill="#000" font-size="13" textLength="319.631">loop and completion/rollback transitions are absent.</text></g><!--link *start* to DRAFT--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="5" data-link-type="dependency"><path d="M594.93,66.558 C594.93,84.058 594.93,116.678 594.93,139.738" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-DRAFT"/><polygon points="594.93,144.738,598.93,135.738,594.93,139.738,590.93,135.738,594.93,144.738" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="595.93" y="110.965" fill="#000" font-size="13" textLength="72.605">createPlan()</text></g><!--link DRAFT to DRAFT--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk4" data-source-line="6" data-link-type="dependency"><path d="M621.78,154.838 C639.37,152.068 656.39,155.478 656.39,165.068 C656.39,174.658 644.309,178.836 626.719,176.066" style="stroke:#181818;stroke-width:1;" fill="none" id="DRAFT-to-DRAFT"/><polygon points="621.78,175.288,630.048,180.639,626.719,176.066,631.293,172.737,621.78,175.288" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="662.39" y="170.465" fill="#000" font-size="13" textLength="77.688">updatePlan()</text></g><!--link DRAFT to PENDING_APPROVAL--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="7" data-link-type="dependency"><path d="M619.2,185.568 C646.91,207.828 688.072,240.897 715.772,263.147" style="stroke:#808080;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="DRAFT-to-PENDING_APPROVAL"/><polygon points="719.67,266.278,715.158,257.523,715.772,263.147,710.148,263.76,719.67,266.278" fill="#808080" style="stroke:#808080;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="679.35" y="229.965" fill="#000" font-size="13" textLength="191.672">submitForApproval() «planned»</text></g><!--link DRAFT to APPROVED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="8" data-link-type="dependency"><path d="M568.11,176.168 C529.82,191.418 458.41,222.958 406.93,264.068 C359.09,302.268 318.777,356.907 298.297,386.9